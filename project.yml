name: Beans

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    sources:
      - Beans
      # MusicFree 插件运行时（crypto-js / cheerio / qs / he 等 JS 库与胶水层）。
      # 注意：XcodeGen 的 target 规格里没有 resources 键，写了会被静默忽略；
      # 必须写成 sources 的一项并显式指定 buildPhase: resources，才会进入
      # Copy Bundle Resources。目录无扩展名 → 默认按 group 处理，内部 .js 会被
      # 平铺复制到 app bundle 根目录，正好对上 MFPluginEngine 按文件名装载的方式。
      - path: PluginRuntime
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beans.app
        MARKETING_VERSION: "1.13.0"
        CURRENT_PROJECT_VERSION: "55"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Beans Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
